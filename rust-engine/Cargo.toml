[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "train_bot"
path = "src/bin/train_bot.rs"

[dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "ImageData",
  "Element",
  "Window",
  "Document",
  "Performance",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
  "console"
] }
wgpu = { version = "24.0", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.29", features = ["bytemuck"] }
fastrand = "2.3"
