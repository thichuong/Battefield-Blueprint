[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "train_bot"
path = "src/bin/train_bot.rs"

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "Element",
  "Window",
  "Document",
  "Performance",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.29"
fastrand = "2.3"
